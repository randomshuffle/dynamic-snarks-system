[package]
name = "flock-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[features]
hash-count = []
unsound-challenger = []
[dependencies]
rayon = "1.10"
sha2 = { version = "0.10", features = ["asm"] }
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
[dev-dependencies]
serde_json = "1"
