[package]
name = "dynamic-ligerito-experiment"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[workspace]
[features]
default = ["compact-merkle", "poseidon-gkr"]
compact-merkle = []
poseidon-gkr = []
[dependencies]
flock-core = { path = "../../vendor/flock-core" }
poseidon2b-compress-ligerito-experiment = { path = "../poseidon2b-compress-ligerito" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
blake3 = "1.8"
thiserror = "2"
rand = "0.10.0"
[profile.release]
lto = "thin"
codegen-units = 1
[profile.test]
opt-level = 3
