[package]
name = "poseidon2b-compress-ligerito-experiment"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[workspace]
[dependencies]
flock-core = { path = "../../vendor/flock-core" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha3 = "0.10"
serde_json = "1"
[profile.release]
lto = "thin"
codegen-units = 1
[profile.test]
opt-level = 3
